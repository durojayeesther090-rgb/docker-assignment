services:
  web:
    image: esther09027/infracloud-web:latest
    container_name: InfraCloud
    ports:
      - "8080:80"
    depends_on:
      - db
  db:
    image: mysql:8
    container_name: infracloud-db
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: appdb
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
